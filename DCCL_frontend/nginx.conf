# /etc/nginx/conf.d/localhost-8080.conf
server {
    listen       8080;
    server_name  localhost;

    root /usr/share/nginx/html;   # Vue 打包后 dist 文件放的位置
    index index.html;

    # 关键：所有找不到的文件都回退到 index.html，让前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }
    # # 把 /dccl/ 前缀剥掉
    # location ^~ /dccl/ {
    #     rewrite ^/dccl/(.*)$ /$1 break;
    #     proxy_pass http://vueapp-service:8080;   # 或 localhost:8080
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # }
    # --------------------- /flask 反向代理 ---------------------
    location ^~ /flask/ {
        # 1. 去掉 /flask 前缀
        rewrite ^/flask/(.*)$ /$1 break;

        # 2. 代理到 Flask
        proxy_pass http://flaskapp-service:5000;
       
        # 3. 关闭所有缓冲 
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Connection '';
        
      
        # 4. 透传常用头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 5. SSE 长连接：24 小时超时
        proxy_connect_timeout 1000s;

        # 6. 关闭分块缓存，让后端实时 flush
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # （可选）禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}